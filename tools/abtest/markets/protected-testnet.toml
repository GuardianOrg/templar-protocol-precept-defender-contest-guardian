# Three same-admin synthetic sources under one proxy. `resolution` here is the
# SEP-40 feed's own granularity and is deliberately NOT the adapter's
# resolution — the adapter is its own Blend oracle. Do not harmonize them.
[oracle]
sources = 3
min_sources = 3
max_age_secs = 3600
max_clock_drift_secs = 60
base = "USD"
decimals = 7
resolution = 300

# Immutable adapter metadata. Construction rejects any other shape.
[adapter]
decimals = 7
resolution = 1
base = "USD"

# Reserve parameters (7-decimal fixed point except supply_cap, a base-unit
# i128 string). `market deploy` refuses any reserve that leaves a parameter
# unset: nothing falls back to the fixture defaults in src/deploy.rs. The
# values below are those defaults spelled out; the live 2026-09-30 market was
# deployed with them. They are testnet fixture values, not reviewed production
# risk parameters (caps are effectively unlimited; weth is i128::MAX).
[reserves.stable]
c_factor = 9000000
l_factor = 9500000
util = 8500000
max_util = 9500000
supply_cap = "1000000000000000000"
r_base = 100000
r_one = 500000
r_two = 5000000
r_three = 15000000
reactivity = 20

[reserves.xlm]
c_factor = 7500000
l_factor = 7500000
util = 5000000
max_util = 9500000
supply_cap = "1000000000000000000"
r_base = 100000
r_one = 500000
r_two = 5000000
r_three = 15000000
