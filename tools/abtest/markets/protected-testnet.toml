# Disposable protected Blend market — single-market configuration template.
#
# Checked in, secret-free, and testnet-only. It carries artifact paths and
# required SHA-256 digests, the oracle quorum/freshness shape, adapter
# metadata, reserve parameters, and initial fake balances. It holds no signer
# keys, no identity aliases, no CLI config directories, and no RPC credentials:
# those live only in the non-serializable runtime execution context.
#
# The parser (`MarketConfig::load` in src/manifest.rs) rejects this file until
# every digest below is a real optimized-Wasm SHA-256 and every path exists.
# That is deliberate: a market must never reach the network on a missing or
# unverified artifact.
#
# Filled 2026-09-25: every path is absolute and every sha256 is the real
# digest of the file at that path (verified by re-hashing, not transcribed).
# Provenance per role:
#   - pool/backstop/factory: pre-existing optimized builds in
#     blend-contracts-v2/target/wasm32-unknown-unknown/optimized/, built from
#     the checked-out ADR-0008/0011 security fork @ 54afdae; byte-identical to
#     the recorded fork-build.json digests in precept-abtest-evidence
#     integrity-20260921 (toolchain of record: cargo/rustc 1.81.0 +
#     stellar contract optimize 22.6.0; the locally installed CLI is 26.1.0,
#     so these are reused-recorded artifacts, not rebuilt here).
#   - token/emitter: prebuilt registry testutils/wasm files from
#     sep-41-token 1.2.0 and blend-contract-sdk 1.22.0 under
#     ~/.cargo/registry, matching registry-inputs.json; comet: the tracked
#     prebuilt blend-contracts-v2/comet.wasm. Not compiled here.
#   - proxy-runtime/proxy-governance: built 2026-09-25 from contracts @
#     6477b1d7 (feat/price-source-publisher, matches pin) via
#     just optimize-runtime/optimize-governance (Rust 1.89.0, Stellar CLI
#     26.1.0, release-soroban-checked profiles).
#   - source: the relocated publisher is in contracts/price-source. Its
#     implementation and tests are unchanged apart from rustfmt; the optimized
#     artifact below was rebuilt here with Rust 1.89.0, Stellar CLI 26.1.0
#     for the build and CLI 22.6.0 for optimization.
#     Its ABI spec matches the original build; its Wasm hash differs from the
#     already deployed source hash 8eb795e8f88651b8e90d61ced81530e2bb379067cdc428c168fb14df7d07a70b.
#     UNQUALIFIED: no size gate or reproducibility record exists for it.
#   - adapter: recover the qualified deployed bytes by a read-only fetch of
#     the testnet adapter contract; the fetched hash equals the previously
#     pinned qualified digest bbdeee7b29d0b6e86af86cbf4ff1e9b76c34a2d27b088134a61151d46e3e17fb.
#     A fresh mixed-version CLI build did not reproduce those bytes and was
#     not substituted.
# VERDICTS: pool 2db04d55fa91246f263c7cd98ba9b436a97e5f32218d67a86ea7beca057939fa
# does NOT equal the reviewed PR #7/8 artifact
# 441e95a552c7397ce65ba2cef7332e02ec85ee0d3da1d944d587702c21266c6b
# (doc/adr/reviews/adr-0007:233) because the working tree is the security
# fork, not that PR's base; blend HEAD is also not the plan's main pin
# ffeca268. Adapter equals its qualified pin. The pool gap is reported for
# operator decision, not silently substituted.
# DURABILITY: the pool/backstop/factory and proxy/source pins resolve into
# build-output trees and the token/emitter pins into cargo's package cache —
# all disposable. A make/cargo clean or registry purge invalidates them, and
# registry paths are registry-hash-specific. Re-hash every pin against
# recorded provenance before any real deploy; treat a stale pin as a hard
# stop, not a rebuild instruction.

[network]
# Market-mode invariant: this exact string, no substitution, not relaxable.
passphrase = "Test SDF Network ; September 2015"
label = "testnet"

# One pin per role. `source` is intentionally reused for all three source
# contracts: three distinct deployments of the same pinned (UNQUALIFIED, see
# above) Wasm, never three different builds. The market gets three distinct
# deployed addresses, which is quorum *shape* only — one administrator, so no
# independent data or Byzantine protection.
[artifacts.pool]
path = "/home/common/projects/templar/blend-contracts-v2/target/wasm32-unknown-unknown/optimized/pool.wasm"
sha256 = "2db04d55fa91246f263c7cd98ba9b436a97e5f32218d67a86ea7beca057939fa"

